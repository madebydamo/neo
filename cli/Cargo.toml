[package]
name = "neo"
version = "0.1.0"
edition = "2021"
description = "Neo homeserver CLI - Rust replacement for bootstrap CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }
git2 = "0.19"
anyhow = "1.0"
thiserror = "2.0"
colored = "2.1"
dirs = "6.0"
tempfile = "3.10"

[build-dependencies]
vergen = { version = "8.0", features = ["build", "git"] }
