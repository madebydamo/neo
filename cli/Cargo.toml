[package]
name = "neo"
version = "0.1.0"
edition = "2021"
description = "Neo homeserver CLI - Rust replacement for bootstrap CLI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
toml_edit = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = "0.19"
anyhow = "1.0"
thiserror = "2.0"
colored = "2.1"
dirs = "6.0"
tempfile = "3.10"
rocket = { version = "0.5", features = ["json"] }
rocket_dyn_templates = { version = "0.1.0-rc.4", features = ["handlebars"] }
tokio = { version = "1", features = ["full"] }
