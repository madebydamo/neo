<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 · packet dropped</title>
  <style>
    :root {
      --void: #06050c;
      --ink: #d7efe6;
      --dim: #7d9a93;
      --wan: #ff6a3d;
      --lan: #3df0c2;
      --ovl: #b388ff;
      --gold: #ffd166;
      --danger: #ff3b6b;
      --glass: rgba(10, 14, 18, 0.55);
      --line: rgba(61, 240, 194, 0.28);
      --sans: ui-sans-serif, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--void);
      color: var(--ink);
      font-family: var(--sans);
      color-scheme: dark;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 70% 40% at 50% 0%, rgba(61, 240, 194, 0.12), transparent 55%),
        radial-gradient(ellipse 50% 30% at 80% 100%, rgba(179, 136, 255, 0.1), transparent 50%),
        radial-gradient(ellipse 40% 28% at 8% 90%, rgba(255, 106, 61, 0.08), transparent 50%),
        var(--void);
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
      touch-action: none;
      cursor: pointer;
    }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 46%, rgba(4, 3, 8, 0.62) 100%),
        linear-gradient(180deg, rgba(6,5,12,0.35), transparent 18%, transparent 78%, rgba(6,5,12,0.55));
    }
    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
    }
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .req {
      font-family: var(--mono);
      font-size: clamp(11px, 2.6vw, 14px);
      line-height: 1.45;
      letter-spacing: 0.01em;
      text-shadow: 0 0 18px rgba(61, 240, 194, 0.35);
      max-width: min(72vw, 42rem);
    }
    .req .verb { color: var(--gold); }
    .req .path { color: var(--lan); }
    .req .host { color: var(--dim); }
    .home {
      pointer-events: auto;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--ink);
      font: 600 12px/1 var(--sans);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 24px rgba(61, 240, 194, 0.12);
    }
    .home:hover { border-color: var(--lan); color: #fff; }
    .mid {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding-top: 4px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
    .chip, .lane-chip {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(8,10,14,0.55);
      backdrop-filter: blur(10px);
    }
    .lane-chip { font-weight: 700; }
    .lane-chip[data-lane="WAN"] { color: var(--wan); box-shadow: 0 0 16px rgba(255,106,61,0.25); }
    .lane-chip[data-lane="LAN"] { color: var(--lan); box-shadow: 0 0 16px rgba(61,240,194,0.25); }
    .lane-chip[data-lane="OVL"] { color: var(--ovl); box-shadow: 0 0 16px rgba(179,136,255,0.28); }
    .chip { color: var(--gold); }
    .stop-name {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }
    .journal {
      font-family: var(--mono);
      font-size: clamp(12px, 2.4vw, 15px);
      color: var(--ink);
      text-shadow: 0 0 12px rgba(255,209,102,0.25);
      white-space: pre-wrap;
      max-width: 70vw;
    }
    .score {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim);
      letter-spacing: 0.12em;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 18px calc(28px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(6,5,12,0.05), rgba(6,5,12,0.55) 55%, rgba(6,5,12,0.78));
    }
    .overlay[hidden] { display: none !important; }
    .card {
      width: min(36rem, 100%);
      pointer-events: auto;
      background: rgba(8, 10, 16, 0.72);
      border: 1px solid rgba(61, 240, 194, 0.22);
      border-radius: 20px;
      padding: 22px 22px 18px;
      backdrop-filter: blur(18px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 30px 80px rgba(0,0,0,0.45),
        0 0 80px rgba(61, 240, 194, 0.08);
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--lan);
      margin: 0 0 8px;
    }
    .card h1 {
      font-family: var(--mono);
      font-size: clamp(28px, 8vw, 64px);
      line-height: 0.9;
      margin: 0 0 10px;
      letter-spacing: -0.04em;
    }
    .card h1.origin { color: var(--gold); text-shadow: 0 0 32px rgba(255,209,102,0.35); }
    .card h1.dead { color: var(--danger); }
    .card h1.wrong { color: var(--ovl); }
    .blurb {
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-wrap;
      margin: 0 0 16px;
    }
    .hint { color: var(--dim); font-size: 13px; margin: 0 0 16px; line-height: 1.45; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(61, 240, 194, 0.1);
      color: var(--ink);
      font: 600 13px/1 var(--sans);
      padding: 12px 16px;
      border-radius: 999px;
      cursor: pointer;
    }
    .btn.primary { background: var(--lan); color: #06201a; border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn:hover { filter: brightness(1.08); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="Packet run"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div class="top">
      <div class="req" id="hud-req">
        <span class="verb">GET</span> <span class="path" id="hud-path">/</span> HTTP/1.1<br>
        <span class="host" id="hud-host">Host: </span>
      </div>
      <a class="home" id="home" href="__NEO_HOME__">Home</a>
    </div>
    <div class="mid">
      <div class="lane-chip" id="hud-lane" data-lane="LAN">LAN</div>
      <div class="stop-name" id="hud-stop">socket</div>
      <div class="chips" id="hud-tags"></div>
    </div>
    <div class="bottom">
      <div class="journal" id="hud-journal">tap to start the request</div>
      <div class="score" id="hud-score"></div>
    </div>
  </div>

  <div class="overlay" id="overlay-start">
    <div class="card">
      <p class="kicker">404</p>
      <h1>GET</h1>
      <p class="hint">You are one HTTP request. The wire pulls you. Hop hazards. Swipe lanes only at splices. Deliver the path.</p>
      <p class="hint" id="start-hint">Tap / Space — Open the page, and you become the request.</p>
      <div class="actions">
        <button class="btn primary" id="btn-start" type="button">Start request</button>
        <a class="btn ghost" href="__NEO_HOME__">Leave the wire</a>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay-end" hidden>
    <div class="card">
      <p class="kicker" id="end-kicker">died in transit</p>
      <h1 class="dead" id="end-title">RST</h1>
      <p class="blurb" id="end-blurb"></p>
      <div class="actions">
        <button class="btn primary" id="btn-retry" type="button">Retry hop</button>
        <button class="btn" id="btn-another" type="button">Another path</button>
        <a class="btn ghost" href="__NEO_HOME__">Home</a>
      </div>
    </div>
  </div>

  <script src="/_neo404/shared.js"></script>
  <script src="/_neo404/course.js"></script>
  <script src="/_neo404/render.js"></script>
  <script src="/_neo404/engine.js"></script>
</body>
</html>
