## Neo-managed — unknown-host catch-all.
## Unknown SNI/Host must not fall through to an arbitrary proxied service.

# HTTP: preserve ACME HTTP-01, otherwise bounce to HTTPS (same as SWAG stock).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /config/www;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS + PROXY-protocol: dedicated 404, never a random upstream.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen __PP_PORT__ ssl proxy_protocol default_server;
    listen [::]:__PP_PORT__ ssl proxy_protocol default_server;
    http2 on;
    server_name _;

    include /config/nginx/ssl.conf;
    include /config/nginx/geo-access.conf;

    charset utf-8;
    root /config/www/neo-404;
    error_page 404 =404 /p/index.html;

    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;
    add_header Cache-Control "no-store" always;

    location ^~ /p/ {
        root /config/www/neo-404;
        types {
            text/html html;
            text/css css;
            application/javascript js;
            text/javascript js;
        }
        error_page 404 =404 /p/asset-missing;
    }

    location = /p/asset-missing {
        internal;
        default_type text/plain;
        return 404 "missing";
    }

    location / {
        return 404;
    }
}

# SWAG loads subdomain vhosts from this file. Do not drop this include.
include /config/nginx/proxy-confs/*.subdomain.conf;
